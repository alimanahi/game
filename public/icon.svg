<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="50%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#141e42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Detective Hat Silhouette -->
  <path d="M160 190 C160 130, 220 110, 256 110 C292 110, 352 130, 352 190 Z" fill="#1e293b"/>
  <ellipse cx="256" cy="190" rx="140" ry="18" fill="url(#gold)"/>
  <rect x="200" y="172" width="112" height="12" rx="6" fill="#f59e0b"/>

  <!-- Golden Magnifying Glass Outer Ring -->
  <circle cx="240" cy="270" r="105" fill="none" stroke="url(#gold)" stroke-width="26" filter="url(#glow)"/>
  <!-- Glass Lens -->
  <circle cx="240" cy="270" r="92" fill="url(#lens)"/>

  <!-- Detective Checkmark & Cross in Lens -->
  <path d="M210 270 L232 292 L280 240" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Magnifying Glass Handle -->
  <path d="M315 345 L385 415" stroke="url(#gold)" stroke-width="32" stroke-linecap="round"/>
  <path d="M340 370 L395 425" stroke="#78350f" stroke-width="20" stroke-linecap="round"/>
</svg>
